<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黒ウィズ 限定精霊所持チェッカー</title>
    <link rel="stylesheet" href="css/styles.css?v=20250704ae">
    <script src="https://cdn.jsdelivr.net/npm/wanakana@5.3.1/dist/wanakana.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <h1>黒ウィズ 限定精霊所持チェッカー</h1>
        <div class="stats" id="stats">所持率: 0 / 0 (0%)</div>
    </header>

    <div class="controls">
        <div class="sync-section">
            <span>🔑 同期コード:</span>
            <input type="text" id="sync-key-input" style="max-width: 150px; font-weight: bold; text-align: center;">
            <button type="button" id="sync-connect-btn">他端末と同期する</button>
            <button type="button" id="add-btn" class="btn-accent">Add</button>
            <span class="hint">※Add は管理用（PIN 入力）。同じ同期コードでスマホ・PC が同期されます</span>
        </div>
        <input type="text" id="search" placeholder="精霊名・イベント名で検索...">
        <select id="filter-element">
            <option value="">全属性</option>
            <option value="火">火属性</option>
            <option value="水">水属性</option>
            <option value="雷">雷属性</option>
            <option value="光">光属性</option>
            <option value="闇">闇属性</option>
        </select>
        <button type="button" id="reset-btn">すべてリセット</button>
    </div>

    <main id="catalog" class="catalog">
        <div class="loading-message">読み込み中...</div>
    </main>

    <dialog id="admin-dialog" class="admin-dialog">
        <form id="admin-form" method="dialog">
            <h2 id="admin-dialog-title">精霊を追加</h2>

            <fieldset class="form-group" id="event-mode-fieldset">
                <legend>イベント</legend>
                <label class="radio-line">
                    <input type="radio" name="event-mode" id="event-mode-existing" value="existing">
                    既存イベントを選ぶ
                </label>
                <label class="radio-line">
                    <input type="radio" name="event-mode" id="event-mode-new" value="new">
                    新規イベントを作る
                </label>
            </fieldset>

            <div id="existing-event-block" class="form-group" hidden>
                <label for="admin-existing-event">既存イベント</label>
                <select id="admin-existing-event"></select>
            </div>

            <div id="new-event-block" class="form-group" hidden>
                <label class="admin-toggle-line" for="admin-event-name-auto-ocr">
                    <span class="admin-toggle-label">画像からイベント名を自動読み取り</span>
                    <span class="admin-toggle">
                        <input type="checkbox" id="admin-event-name-auto-ocr">
                        <span class="admin-toggle-slider" aria-hidden="true"></span>
                    </span>
                </label>

                <label for="admin-event-abbr">イベント略称</label>
                <div class="admin-input-row">
                    <input type="text" id="admin-event-abbr" placeholder="例: かみさんぽっ3">
                    <button type="button" class="btn-ocr-select" data-ocr-target="abbr">自動認識</button>
                </div>

                <label for="admin-event-title">イベント正式名</label>
                <div class="admin-input-row">
                    <input type="text" id="admin-event-title" placeholder="例: かみさんぽっ!人と妖精の国アイリー">
                    <button type="button" class="btn-ocr-select" data-ocr-target="title">自動認識</button>
                </div>
            </div>

            <div id="spirit-details-block" hidden>
                <div id="edit-name-block" class="form-group" hidden>
                    <label for="admin-spirit-name">精霊名</label>
                    <input type="text" id="admin-spirit-name" placeholder="例: 神と和解せよ カヌエ・デ・ヤシロ">
                </div>

                <div id="edit-attrs-block" class="form-row" hidden>
                    <div class="form-group">
                        <label for="admin-spirit-main">メイン属性</label>
                        <select id="admin-spirit-main"></select>
                    </div>
                    <div class="form-group">
                        <label for="admin-spirit-sub">サブ属性</label>
                        <select id="admin-spirit-sub"></select>
                    </div>
                </div>

                <div class="form-group" id="admin-image-group">
                    <label for="admin-spirit-image">精霊画像</label>
                    <div class="admin-image-dropzone" id="admin-image-dropzone">
                        <input type="file" id="admin-spirit-image" class="admin-spirit-image-input" accept="image/png,image/jpeg,image/webp,image/gif">
                        <p class="admin-image-dropzone-label" id="admin-image-dropzone-label">クリックしてファイルを選択<br>または Ctrl+V で貼り付け<br><small>「自動読み取り」オン時はイベント名も取得。スクショは精霊をクリックで切り抜き（複数可）</small></p>
                        <div class="admin-image-preview-stage" id="admin-image-preview-stage" hidden>
                            <img id="admin-image-preview" class="admin-image-preview" alt="">
                            <div id="admin-ocr-region-overlays" class="admin-ocr-region-overlays" hidden></div>
                            <div id="admin-ocr-selection" class="admin-ocr-selection" hidden></div>
                        </div>
                    </div>
                    <p id="admin-image-hint" class="field-hint">PNG / JPG など（必須）。「自動読み取り」をオンにするとイベント名を取得。スクショは精霊をクリックで切り抜き（複数可）</p>
                </div>

                <div id="spirit-queue-block" class="spirit-queue-block" hidden>
                    <p class="spirit-queue-heading" id="spirit-queue-heading">追加する精霊 0体</p>
                    <ul id="spirit-queue-list" class="spirit-queue-list"></ul>
                </div>
            </div>

            <div class="dialog-actions">
                <button type="button" id="admin-cancel-btn">キャンセル</button>
                <button type="submit" id="admin-submit-btn">追加する</button>
            </div>
        </form>
    </dialog>

    <script type="module" src="js/app.js?v=20250705w"></script>
</body>
</html>
