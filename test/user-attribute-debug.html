<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>User spirit attribute debug</title>
    <style>
        body { font-family: monospace; background: #111; color: #eee; padding: 16px; }
        pre { background: #222; padding: 12px; border-radius: 8px; white-space: pre-wrap; }
        img { max-width: 100%; border: 1px solid #444; }
        .row { display: flex; gap: 16px; flex-wrap: wrap; }
        .card { background: #1a1a1a; padding: 12px; border-radius: 8px; max-width: 480px; }
    </style>
</head>
<body>
    <h1>User spirit attribute debug</h1>
    <div id="out"></div>
    <script type="module">
        import {
            detectSpiritAttributes,
            detectSpiritCropRectAtClick,
            detectSpiritCropRectAtClickByContour,
            detectSpiritCropRectAtClickByPixelScan,
            calcAttributeSampleRegions,
            squareCropRectForImage,
            readImageDataFromElement
        } from '../js/spirit-image.js?v=thunder-fix';

        const out = document.getElementById('out');

        function log(html) {
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = html;
            out.appendChild(div);
        }

        async function load(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = src;
            });
        }

        function analyzeCrop(image, cropRect, label) {
            const { imageData, width, height } = readImageDataFromElement(image);
            const attrs = detectSpiritAttributes(imageData, width, height, cropRect);
            const regions = calcAttributeSampleRegions(cropRect);
            return { label, cropRect, attrs, regions, width, height };
        }

        function sampleColors(image, cropRect) {
            const { imageData, width, height } = readImageDataFromElement(image);
            const regions = calcAttributeSampleRegions(cropRect);
            function avg(region) {
                let r = 0, g = 0, b = 0, n = 0;
                for (let py = region.y; py < region.y + region.h; py++) {
                    for (let px = region.x; px < region.x + region.w; px++) {
                        const i = (py * width + px) * 4;
                        r += imageData.data[i]; g += imageData.data[i+1]; b += imageData.data[i+2]; n++;
                    }
                }
                return n ? { r: r/n, g: g/n, b: b/n, n } : null;
            }
            return { main: avg(regions.main), sub: avg(regions.sub) };
        }

        async function testClick(image, src, clickX, clickY, label, expected) {
            const { imageData, width, height } = readImageDataFromElement(image);
            const contour = detectSpiritCropRectAtClickByContour(imageData, width, height, clickX, clickY);
            const pixel = detectSpiritCropRectAtClickByPixelScan(imageData, width, height, clickX, clickY);
            const crop = detectSpiritCropRectAtClick(imageData, width, height, clickX, clickY);
            const attrs = crop ? detectSpiritAttributes(imageData, width, height, crop) : null;
            const colors = crop ? sampleColors(image, crop) : null;
            log(`<h2>${label}</h2>
                <p>click=(${clickX},${clickY}) expected main=${expected.main} sub=${expected.sub}</p>
                <p>contour crop: <code>${JSON.stringify(contour)}</code></p>
                <p>pixel crop: <code>${JSON.stringify(pixel)}</code></p>
                <p>used crop: <code>${JSON.stringify(crop)}</code></p>
                <p>attrs: <code>${JSON.stringify(attrs)}</code></p>
                <p>raw avg colors: <code>${JSON.stringify(colors)}</code></p>`);
        }

        const eventImg = await load('samples/user-event-row.png');
        const spiritImg = await load('samples/user-spirit-thunder-water.png');

        const direct = analyzeCrop(spiritImg, squareCropRectForImage(spiritImg.width, spiritImg.height), 'direct spirit icon');
        log(`<h2>Direct spirit icon</h2><pre>${JSON.stringify(direct, null, 2)}</pre><img src="samples/user-spirit-thunder-water.png">`);

        const w = eventImg.width, h = eventImg.height;
        const clicks = [
            [w * 0.13, h * 0.72, 'spirit1', { main: '火', sub: '水' }],
            [w * 0.36, h * 0.72, 'spirit2 sunflower', { main: '雷', sub: '水' }],
            [w * 0.59, h * 0.72, 'spirit3 whitehair (img2)', { main: '雷', sub: '水' }],
            [w * 0.83, h * 0.72, 'spirit4', { main: '水', sub: '火' }],
        ];
        for (const [rx, ry, label, exp] of clicks) {
            await testClick(eventImg, 'samples/user-event-row.png', Math.round(rx), Math.round(ry), label, exp);
        }
    </script>
</body>
</html>
